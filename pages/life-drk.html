<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/drk.png" type="image/x-icon">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Gallery - DRK Institute of Science and Technology</title>
    <style>
        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .breadcrumb {
            padding: 15px 20px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            position: relative;
            z-index: 10;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: #007bff;
            text-decoration: underline;
        }

        .breadcrumb span {
            color: #333;
            font-weight: 500;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            line-height: 1.2;
            position: relative;
        }

        .title-underline {
            width: 80px;
            height: 4px;
            background-color: #c41e3a;
            margin: 0 auto;
            border-radius: 2px;
        }

        /* Photo Gallery */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 40px;
            position: relative;
            z-index: 1;
        }

        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1;
        }

        .photo-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Close Button */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            background: #c41e3a;
            transform: rotate(90deg);
        }

        /* Navigation Arrows */
        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 30px;
            padding: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: #c41e3a;
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: 30px;
        }

        .lightbox-next {
            right: 30px;
        }

        /* Image Counter */
        .lightbox-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
        }

        /* Loading Spinner */
        .lightbox-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .photo-gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
            }
        }

        @media (max-width: 992px) {
            .photo-gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }

            .page-title {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 768px) {
            .photo-gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .page-title {
                font-size: 2rem;
            }

            .lightbox-prev,
            .lightbox-next {
                font-size: 24px;
                padding: 15px;
            }

            .lightbox-prev {
                left: 10px;
            }

            .lightbox-next {
                right: 10px;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                font-size: 30px;
                width: 40px;
                height: 40px;
            }

            .lightbox-counter {
                font-size: 14px;
                padding: 8px 15px;
                bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .photo-gallery {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .container {
                padding: 15px;
            }

            .page-title {
                font-size: 1.8rem;
            }

            .lightbox-content {
                max-width: 95%;
            }

            .lightbox-prev,
            .lightbox-next {
                font-size: 20px;
                padding: 10px;
            }
        }

        /* Add smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Prevent body scroll when lightbox is open */
        body.lightbox-open {
            overflow: hidden;
        }
    </style>
</head>

    <script>
        // Lightbox Gallery Script
        class LightboxGallery {
            constructor() {
                this.lightbox = document.getElementById('lightbox');
                this.lightboxImage = document.getElementById('lightboxImage');
                this.lightboxClose = document.getElementById('lightboxClose');
                this.lightboxPrev = document.getElementById('lightboxPrev');
                this.lightboxNext = document.getElementById('lightboxNext');
                this.lightboxCounter = document.getElementById('lightboxCounter');
                this.lightboxLoading = document.getElementById('lightboxLoading');
                
                this.images = [];
                this.currentIndex = 0;
                
                this.init();
            }
            
            init() {
                // Get all gallery images
                const photoItems = document.querySelectorAll('.photo-item');
                photoItems.forEach((item, index) => {
                    const img = item.querySelector('img');
                    this.images.push(img.src);
                    
                    item.addEventListener('click', () => {
                        this.openLightbox(index);
                    });
                });
                
                // Event listeners
                this.lightboxClose.addEventListener('click', () => this.closeLightbox());
                this.lightboxPrev.addEventListener('click', () => this.prevImage());
                this.lightboxNext.addEventListener('click', () => this.nextImage());
                
                // Close on background click
                this.lightbox.addEventListener('click', (e) => {
                    if (e.target === this.lightbox) {
                        this.closeLightbox();
                    }
                });
                
                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (!this.lightbox.classList.contains('active')) return;
                    
                    if (e.key === 'Escape') this.closeLightbox();
                    if (e.key === 'ArrowLeft') this.prevImage();
                    if (e.key === 'ArrowRight') this.nextImage();
                });
                
                // Touch swipe support
                let touchStartX = 0;
                let touchEndX = 0;
                
                this.lightbox.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                });
                
                this.lightbox.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    this.handleSwipe(touchStartX, touchEndX);
                });
            }
            
            openLightbox(index) {
                this.currentIndex = index;
                this.lightbox.classList.add('active');
                document.body.classList.add('lightbox-open');
                this.showImage();
            }
            
            closeLightbox() {
                this.lightbox.classList.remove('active');
                document.body.classList.remove('lightbox-open');
            }
            
            showImage() {
                // Show loading spinner
                this.lightboxLoading.style.display = 'block';
                this.lightboxImage.style.display = 'none';
                
                // Load image
                const img = new Image();
                img.onload = () => {
                    this.lightboxImage.src = this.images[this.currentIndex];
                    this.lightboxLoading.style.display = 'none';
                    this.lightboxImage.style.display = 'block';
                    this.updateCounter();
                };
                img.src = this.images[this.currentIndex];
            }
            
            prevImage() {
                this.currentIndex = (this.currentIndex - 1 + this.images.length) % this.images.length;
                this.showImage();
            }
            
            nextImage() {
                this.currentIndex = (this.currentIndex + 1) % this.images.length;
                this.showImage();
            }
            
            updateCounter() {
                this.lightboxCounter.textContent = `${this.currentIndex + 1} / ${this.images.length}`;
            }
            
            handleSwipe(startX, endX) {
                const threshold = 50;
                const diff = startX - endX;
                
                if (Math.abs(diff) > threshold) {
                    if (diff > 0) {
                        this.nextImage();
                    } else {
                        this.prevImage();
                    }
                }
            }
        }
        
        // Initialize gallery when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LightboxGallery();
            
            // Add loading animation for gallery items
            const photoItems = document.querySelectorAll('.photo-item');
            photoItems.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    item.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, index * 50);
            });
        });
        
        // Load header, footer, chatbot
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
                const script = document.createElement('script');
                script.src = '../static/menu.js';
                script.onload = function() {
                    if (typeof initMobileMenu === 'function') {
                        initMobileMenu();
                    }
                };
                document.body.appendChild(script);
            });
         fetch('../scroll.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('scrollTopBtn').innerHTML = data;

      // Load JS separately if needed
      const script = document.createElement('script');
      script.src = '../static/scroll.js';
      document.body.appendChild(script);
    });
            
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {

        fetch('chatbot.html')

                const script = document.createElement('script');
                script.src = '../static/chatbot.js';
                document.body.appendChild(script);
            });
