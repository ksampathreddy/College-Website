<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/drk.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="../static/style.css"> 
    <title>Latest Events - DRK Institute of Science and Technology</title>
    
    <style>
        :root {
            --primary-color: #1a237e;
            --accent-color: #ff9800;
            --text-dark: #333;
            --text-light: #666;
            --bg-gray: #f4f7f9;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #fff;
            color: var(--text-dark);
            line-height: 1.6;
        }
        .main-header {
    position: fixed;
    top: 0;
    z-index: 2000;
}
     .breadcrumb {
            padding: 15px 20px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* Section Header */
        .s-header {
    text-align: center;
    padding: 60px 20px 40px;
    background-color: var(--bg-gray);
}
        .s-header h1 {
            font-size: 2.8rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        .s-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent-color);
            border-radius: 2px;
        }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Timeline Logic */
        .timeline-container { position: relative; padding: 40px 0; }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary-color), var(--accent-color));
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 80px;
            position: relative;
        }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }

        .timeline-content-wrapper { width: 45%; }
        .timeline-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease;
            border-top: 5px solid var(--primary-color);
        }
        .timeline-card:hover { transform: translateY(-5px); }

        /* Small Preview Box Enhancements */
        .timeline-image-wrapper {
            width: 45%;
            height: 380px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            position: relative;
            cursor: pointer; /* Makes it look clickable */
        }

        /* Small Preview Nav Buttons */
        .timeline-image-wrapper .swiper-button-next,
        .timeline-image-wrapper .swiper-button-prev {
            color: white;
            background: rgba(0, 0, 0, 0.3);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            transition: 0.3s;
        }
        .timeline-image-wrapper .swiper-button-next:after,
        .timeline-image-wrapper .swiper-button-prev:after {
            font-size: 14px;
            font-weight: bold;
        }
        .timeline-image-wrapper .swiper-button-next:hover,
        .timeline-image-wrapper .swiper-button-prev:hover {
            background: var(--accent-color);
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            background: white;
            border: 4px solid var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Event Details */
        .event-date { color: var(--accent-color); font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .event-title { font-size: 1.7rem; color: var(--primary-color); margin: 0 0 15px 0; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .tag { background: #eef1f9; color: var(--primary-color); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        .view-gallery-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .view-gallery-btn:hover { background: var(--accent-color); color: var(--primary-color); }

        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            padding: 40px;
        }
        
        /* Repositioned X Mark */
        .modal-close { 
            position: absolute; 
            top: 20px; 
            right: 40px; 
            color: white; 
            font-size: 50px; 
            cursor: pointer; 
            z-index: 10000;
            line-height: 1;
            transition: 0.3s;
        }
        .modal-close:hover { color: var(--accent-color); transform: scale(1.1); }

        /* Swiper Fixes */
        .swiper { width: 100%; height: 100%; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .image-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            z-index: 5;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .timeline-container::before, .timeline-dot { left: 20px; transform: none; }
            .timeline-item, .timeline-item:nth-child(even) { flex-direction: column; align-items: flex-start; }
            .timeline-content-wrapper, .timeline-image-wrapper { width: calc(100% - 50px); margin-left: 50px; }
            .timeline-image-wrapper { height: 280px; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div id="header"></div>

    <nav class="breadcrumb">
            <a href="../index.html">Home</a> / <span>Latest Events</span>
     
    </nav>

    <main class="main-container">
        <header class="s-header">
            <h1>Latest Events</h1>
            <p>Highlights of recent activities at DRK Institute of Science and Technology</p>
        </header>

        <div class="timeline-container" id="timelineItems"></div>
    </main>

    <div class="gallery-modal" id="galleryModal">
        <span class="modal-close" id="modalClose">&times;</span>
        <div class="swiper modal-swiper" id="modalSwiper">
            <div class="swiper-wrapper" id="modalSwiperWrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <div class="scroll-to-top">
        <img src="../static/ar.png" alt="Scroll to top" id="scrollTopBtn">
    </div>

    <div id="chatbot"></div>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const eventsData = [
            {
                id: 0,
                date: "Mar 07, 2026",
                title: "Women's Day 2026",
                description: "Celebrating the Strength and Grace of Women",
                images: ["../static/latest_events/womens1.jpeg","../static/latest_events/womens2.jpeg","../static/latest_events/womens3.jpeg","../static/latest_events/womens4.jpeg","../static/latest_events/womens.jpeg","../static/latest_events/womens5.jpeg","../static/latest_events/womens6.jpeg","../static/latest_events/womens7.jpeg","../static/latest_events/womens8.jpeg"],
                tags: ["International Womens Day"]
            },
            {
                id: 0,
                date: "Mar 07, 2026",
                title: "Zentron Hackathon 2026",
                description: "Conducted by Department of AI&ML and Cyber Security.",
                images: ["../static/latest_events/hack1.jpeg","../static/latest_events/hack2.jpeg","../static/latest_events/hack3.jpeg","../static/latest_events/hack4.jpeg","../static/latest_events/hack5.jpeg","../static/latest_events/hack6.jpeg","../static/latest_events/hack7.jpeg","../static/latest_events/hack8.jpeg"],
                tags: ["Hackathon", "Innovate"]
            },
            {
                id: 1,
                date: "Feb 21, 2026",
                title: "Workshop on Ethical Hacking & Cyber Security Essentials",
                description: "Conducted by Department of AI&ML and Cyber Security, this workshop provided hands-on training in ethical hacking techniques and cybersecurity best practices.",
                images: ["../static/latest_events/cyber_workshop1.jpeg", "../static/latest_events/cyber_workshop2.jpeg", "../static/latest_events/cyber_workshop3.jpeg", "../static/latest_events/cyber_workshop4.jpeg", "../static/latest_events/cyber_workshop5.jpeg", "../static/latest_events/cyber_workshop6.jpeg", "../static/latest_events/cyber_workshop7.jpeg", "../static/latest_events/cyber_workshop8.jpeg", "../static/latest_events/cyber_workshop9.jpeg"],
                tags: ["Workshop", "Cyber Security", "Ethical Hacking"]
            },
            {
                id: 2,
                date: "Jan 27-31, 2026",
                title: "5 Day Certified VLSI Workshop",
                description: "Hands-on training in chip design, covering RTL coding to physical layout using industry-standard tools.",
                images: [
                    "../static/latest_events/VLSI1.jpg",
                    "../static/latest_events/VLSI2.jpeg",
                    "../static/latest_events/VLSI3.jpg",
                    "../static/latest_events/VLSI4.jpg",
                    "../static/latest_events/VLSI5.jpg",
                    "../static/latest_events/VLSI6.jpg",
                    "../static/latest_events/VLSI7.jpg",
                    "../static/latest_events/VLSI8.jpg",
                    "../static/latest_events/VLSI9.jpg",
                    "../static/latest_events/VLSI10.jpg"
                ],
                tags: ["Workshop", "VLSI"]
            },
            {
                id: 3,
                date: "Jan 26, 2026",
                title: "Republic Day",
                description: "Flag hoisting ceremony and patriotic tributes honoring India's Constitution.",
                images: ["../static/latest_events/republic_day.jpeg"],
                tags: ["Celebration"]
            },
            {
                id: 4,
                date: "Jan 10, 2026",
                title: "Sankranthi Festival",
                description: "Harvest festival celebrated with Rangoli, traditional games, and cultural performances.",
                images: [
                    "../static/latest_events/s3.jpeg",
                    "../static/latest_events/s1.jpeg",
                    "../static/latest_events/Sankranthi.jpeg",
                    "../static/latest_events/s5.jpeg",
                    "../static/latest_events/s2.jpeg",
                    "../static/latest_events/s6.jpeg",
                    "../static/latest_events/s7.jpeg",
                    "../static/latest_events/s8.jpeg",
                ],  
                tags: ["Festival", "Tradition"]
            }
        ];

        function renderTimeline() {
            const container = document.getElementById("timelineItems");
            eventsData.forEach(event => {
                const item = document.createElement("div");
                item.className = "timeline-item";
                const slides = event.images.map(img => `<div class="swiper-slide"><img src="${img}"></div>`).join("");
                
                item.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-content-wrapper">
                        <div class="timeline-card">
                            <div class="event-date"><i class="fas fa-calendar"></i> ${event.date}</div>
                            <h3 class="event-title">${event.title}</h3>
                            <p>${event.description}</p>
                            <div class="tag-container">${event.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                            <button class="view-gallery-btn" onclick="openGallery(${event.id})">View Photos</button>
                        </div>
                    </div>
                    <div class="timeline-image-wrapper" onclick="openGallery(${event.id})">
                        <div class="swiper swiper-${event.id}">
                            <div class="swiper-wrapper">${slides}</div>
                            <div class="swiper-button-next" onclick="event.stopPropagation()"></div>
                            <div class="swiper-button-prev" onclick="event.stopPropagation()"></div>
                            <div class="image-counter">1 / ${event.images.length}</div>
                        </div>
                    </div>
                `;
                container.appendChild(item);

                new Swiper(`.swiper-${event.id}`, {
                    navigation: {
                        nextEl: `.swiper-${event.id} .swiper-button-next`,
                        prevEl: `.swiper-${event.id} .swiper-button-prev`,
                    },
                    loop: true,
                    on: { slideChange: function() { 
                        item.querySelector('.image-counter').innerText = `${this.realIndex + 1} / ${event.images.length}`;
                    }}
                });
            });
        }

        let modalSwiperInstance = null;
        function openGallery(id) {
            const event = eventsData.find(e => e.id === id);
            const wrapper = document.getElementById('modalSwiperWrapper');
            wrapper.innerHTML = event.images.map(img => `<div class="swiper-slide"><img src="${img}" style="object-fit: contain;"></div>`).join("");
            document.getElementById('galleryModal').style.display = 'block';
            if (modalSwiperInstance) modalSwiperInstance.destroy();
            modalSwiperInstance = new Swiper('#modalSwiper', { 
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                loop: true
            });
        }

        document.getElementById('modalClose').onclick = () => document.getElementById('galleryModal').style.display = 'none';

        function loadComponent(id, path, scriptPath = null, callback = null) {
            fetch(path)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (scriptPath) {
                        const script = document.createElement('script');
                        script.src = scriptPath;
                        if (callback) script.onload = callback;
                        document.body.appendChild(script);
                    }
                });
        }

        window.onload = () => {
            renderTimeline();
            loadComponent('header', 'header.html', '../static/menu.js', () => {
                if (typeof initMobileMenu === 'function') initMobileMenu();
            });
            loadComponent('footer', 'footer.html');
            loadComponent('chatbot', 'chatbot.html', '../static/chatbot.js');
            
            fetch('../scroll.html').then(res => res.text()).then(data => {
                document.getElementById('scrollTopBtn').parentElement.innerHTML = data;
                const s = document.createElement('script'); s.src = '../static/scroll.js';
                document.body.appendChild(s);
            });
        };
    </script>
</body>
</html>
